# Tests every push and pull request, so a broken main shows at once rather
# than at the next release. Windows, like the players, with the Go the
# releases are built with.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Lint
        run: make lint

      - name: Test
        run: go test ./...
